<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<title>简历体检 · 床旁之外</title>
<link rel="stylesheet" href="style.css">
<style>
.back{display:inline-flex;align-items:center;font-size:17px;color:var(--tint);margin:6px 0 4px;font-weight:500}
.back:active{opacity:.6}
.seg{display:flex;gap:2px;background:rgba(120,120,128,.12);border-radius:9px;padding:2px;margin:14px 0 14px}
.seg button{flex:1;border:0;background:none;font-family:inherit;font-size:13px;padding:7px 4px;
  border-radius:7px;color:var(--label);font-weight:500;transition:all .2s cubic-bezier(.32,.72,0,1)}
.seg button.on{background:var(--bg-elev);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.progress{height:3px;background:rgba(120,120,128,.18);border-radius:2px;overflow:hidden;margin:0 0 16px}
.progress i{display:block;height:100%;width:0;background:var(--tint);border-radius:2px;
  transition:width .4s cubic-bezier(.32,.72,0,1)}
.qcard{background:var(--bg-elev);border-radius:16px;padding:16px;margin-bottom:12px}
.qhead{display:flex;gap:9px;align-items:baseline;margin-bottom:10px}
.qnum{font-size:12px;color:var(--tint);font-weight:700;font-variant-numeric:tabular-nums}
.qtxt{font-size:16px;font-weight:600;line-height:1.45;letter-spacing:-.2px}
.qhint{font-size:12px;color:var(--label2);margin:-4px 0 10px 27px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-radius:11px;
  background:rgba(120,120,128,.07);border:1.5px solid transparent;
  font-size:14px;line-height:1.45;transition:all .22s cubic-bezier(.32,.72,0,1)}
.opt:active{transform:scale(.985)}
.opt.on{background:var(--tint-soft);border-color:var(--tint)}
.mark{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--label3);
  flex:none;margin-top:1px;display:grid;place-items:center;transition:all .22s cubic-bezier(.32,.72,0,1)}
.opt.multi .mark{border-radius:6px}
.opt.on .mark{background:var(--tint);border-color:var(--tint)}
.mark svg{width:11px;height:11px;opacity:0;transition:opacity .15s}
.opt.on .mark svg{opacity:1}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:60;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(242,242,247,.88);border-top:.5px solid var(--sep);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
@media (prefers-color-scheme:dark){.bottombar{background:rgba(0,0,0,.8)}}
.bottombar .btn{width:100%;border:0;font-family:inherit}
.bottombar .btn[disabled]{opacity:.38;box-shadow:none}
.padbottom{padding-bottom:120px}
.sheet{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;
  -webkit-overflow-scrolling:touch;transform:translateY(100%);
  transition:transform .46s cubic-bezier(.32,.72,0,1)}
.sheet.show{transform:none}
.sheet-inner{max-width:560px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom))}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-top h5{margin:0;font-size:17px;font-weight:600}
.linkbtn{background:none;border:0;color:var(--tint);font-size:15px;font-family:inherit;padding:6px}
.linkbtn:active{opacity:.5}
.bigscore{text-align:center;padding:4px 0 2px}
.bigscore b{font-size:64px;font-weight:700;letter-spacing:-3px;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--tint)}
.bigscore span{font-size:16px;color:var(--label3)}
.lv{text-align:center;font-size:14px;color:var(--label2);margin:6px 0 0}
.delta{text-align:center;font-size:13px;margin:10px 0 0;font-weight:600}
.delta.up{color:#248A3D}.delta.down{color:#C8503C}.delta.flat{color:var(--label2)}
@media (prefers-color-scheme:dark){.delta.up{color:#4CD964}.delta.down{color:#FF6B5E}}
.radarwrap{background:var(--bg-elev);border-radius:16px;padding:10px 6px 4px;margin:16px 0}
.radar{width:100%;height:auto;color:var(--label)}
.radar .gl{fill:none;stroke:currentColor;stroke-opacity:.13;stroke-width:1}
.radar .ax{stroke:currentColor;stroke-opacity:.16;stroke-width:1}
.radar .area{fill:var(--tint);fill-opacity:.22;stroke:var(--tint);stroke-width:2;stroke-linejoin:round}
.radar text{fill:currentColor;fill-opacity:.55;font-size:9px;font-family:inherit}
.issue{display:flex;gap:10px;padding:13px;background:var(--bg-elev);border-radius:13px;margin-bottom:8px}
.dot2{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot2.r{background:#FF3B30}.dot2.y{background:#FF9500}.dot2.g{background:#34C759}
.issue h4{margin:0 0 3px;font-size:14px;font-weight:600}
.issue p{margin:0;font-size:13px;color:var(--label2);line-height:1.5}
.hist{display:flex;align-items:center;justify-content:space-between;padding:11px 0;
  font-size:14px;position:relative}
.hist + .hist::before{content:"";position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
.hist b{font-variant-numeric:tabular-nums;color:var(--tint);font-weight:600}
.cardwrap{margin-top:16px}
.cardwrap img{width:100%;display:block;border-radius:16px}
.tipnote{font-size:12px;color:var(--label2);text-align:center;margin:10px 0 0}
.minibtn{width:100%;height:46px;border-radius:12px;border:1.5px solid rgba(11,110,95,.28);
  background:transparent;color:var(--tint);font-size:15px;font-weight:600;font-family:inherit;
  margin-top:10px;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.minibtn:active{transform:scale(.97);opacity:.7}
</style>
</head>
<body>

<main class="padbottom">
  <a class="back" href="index.html">‹ 返回</a>
  <h1 class="large">简历体检</h1>
  <p class="sub">先选你的身份，题库不一样。简历不上传，分数只在你手机上。</p>

  <div class="seg" id="seg">
    <button data-m="fresh" class="on">应届 / 实习期</button>
    <button data-m="exp">在职护士</button>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div id="list"></div>
  <p class="footnote">
    应届生请放心：**没有注册执业证是正常的**，写上「已通过护士执业资格考试」就够了，这一项不会扣你多少分。
  </p>
</main>

<div class="bottombar">
  <button class="btn btn-fill" id="go" disabled>查看结果 · 已完成 0/8</button>
</div>

<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>

<script>
var SKILLS = [
  {t:'静脉穿刺 / 静脉输液', s:2},
  {t:'导尿 / 留置尿管护理', s:2},
  {t:'吸痰 / 气道管理', s:2},
  {t:'心电监护 / 除颤', s:2},
  {t:'抢救配合 / 心肺复苏', s:2},
  {t:'护理文书 / 三查七对', s:2},
  {t:'危重患者护理', s:2},
  {t:'伤口 / 造口护理', s:2}
];

var QUIZ_FRESH = [
  { id:'f1', dim:'实习质量', type:'multi', max:22,
    q:'实习经历，写到了哪些？', hint:'这是应届生最该加重的一块',
    opts:[
      {t:'实习满 8 个月以上', s:5},
      {t:'轮转过 3 个以上科室', s:5},
      {t:'每个科室都写了具体做了什么', s:4},
      {t:'有带教老师评语或「优秀实习生」', s:4},
      {t:'写了独立完成的操作例数', s:4}
    ]},
  { id:'f2', dim:'执业进度', type:'single', max:12,
    q:'护士执业资格考试，你现在到哪一步了？', hint:'应届写「已通过」完全合规，不需要注册',
    opts:[
      {t:'已通过，成绩合格', s:12},
      {t:'已报名，正在备考', s:8},
      {t:'还没开始准备', s:3},
      {t:'不打算考', s:0}
    ]},
  { id:'f3', dim:'护理技能', type:'multi', max:15,
    q:'明确写进简历的操作有哪些？', hint:'可多选，每项 2 分',
    opts: SKILLS },
  { id:'f4', dim:'在校表现', type:'multi', max:16,
    q:'在校期间有哪些拿得出手的？', hint:'可多选',
    opts:[
      {t:'专业排名前 30%', s:5},
      {t:'拿过奖学金', s:4},
      {t:'护理技能竞赛获奖', s:3},
      {t:'学生干部 / 社团负责人', s:2},
      {t:'有志愿服务时长记录', s:2}
    ]},
  { id:'f5', dim:'量化成果', type:'multi', max:12,
    q:'简历里有没有具体数字？', hint:'可多选',
    opts:[
      {t:'操作例数（如穿刺 300 例）', s:4},
      {t:'参与护理过的患者数或床位数', s:3},
      {t:'带教或帮扶学弟学妹的人数', s:2},
      {t:'满意度、表彰或评价数据', s:3}
    ]},
  { id:'f6', dim:'目标匹配', type:'single', max:10,
    q:'这份简历，是照着目标医院改的吗？',
    opts:[
      {t:'对着招聘公告逐条改过', s:10},
      {t:'大致了解要求，改了一些', s:7},
      {t:'一份简历投所有医院', s:3},
      {t:'还没看过招聘公告', s:0}
    ]},
  { id:'f7', dim:'排版规范', type:'multi', max:8,
    q:'排版细节做到了哪些？', hint:'可多选',
    opts:[
      {t:'一页以内', s:3},
      {t:'手机号和邮箱都写了', s:2},
      {t:'用 PDF 格式投递', s:1.5},
      {t:'文件名规范（姓名-学校-专业）', s:1},
      {t:'有正装照片', s:0.5}
    ]},
  { id:'f8', dim:'加分项', type:'multi', max:5,
    q:'还有这些加分的东西吗？', hint:'可多选',
    opts:[
      {t:'论文或科研经历', s:2},
      {t:'品管圈 QCC / 创新项目', s:1.5},
      {t:'英语四六级 / 雅思', s:1},
      {t:'计算机或其他证书', s:0.5}
    ]}
];

var QUIZ_EXP = [
  { id:'e1', dim:'执业资质', type:'single', max:15,
    q:'你的护士执业证，现在什么状态？',
    opts:[
      {t:'已注册，且在有效期内', s:15},
      {t:'已注册，但半年内到期', s:10},
      {t:'中断注册 / 待重新注册', s:4},
      {t:'没有注册', s:0}
    ]},
  { id:'e2', dim:'工作经历', type:'multi', max:22,
    q:'工作经历写了哪些？', hint:'可多选',
    opts:[
      {t:'二甲或以上医院，正式工作满 2 年', s:6},
      {t:'有明确专科方向（ICU / 急诊 / 手术室等）', s:6},
      {t:'有独立值班或带组经验', s:5},
      {t:'有轮转或进修经历', s:3},
      {t:'写明了分管床位数', s:2}
    ]},
  { id:'e3', dim:'护理技能', type:'multi', max:15,
    q:'明确写进简历的操作有哪些？', hint:'可多选，每项 2 分',
    opts: SKILLS },
  { id:'e4', dim:'证书资质', type:'multi', max:13,
    q:'手上有哪些证书或职称？', hint:'可多选',
    opts:[
      {t:'护师职称', s:4},
      {t:'主管护师及以上', s:3},
      {t:'BLS / ACLS 等急救证书', s:2},
      {t:'专科护士证', s:2},
      {t:'继续教育学分齐全', s:2}
    ]},
  { id:'e5', dim:'量化成果', type:'multi', max:15,
    q:'简历里有具体数字吗？', hint:'可多选',
    opts:[
      {t:'护理人次 / 分管床位数', s:5},
      {t:'带教人数', s:4},
      {t:'质控项目或不良事件改善', s:3},
      {t:'满意度提升数据', s:3}
    ]},
  { id:'e6', dim:'目标匹配', type:'single', max:10,
    q:'这份简历，是照着目标医院改的吗？',
    opts:[
      {t:'对着招聘公告逐条改过', s:10},
      {t:'大致了解要求，改了一些', s:7},
      {t:'一份简历投所有医院', s:3},
      {t:'还没看过招聘公告', s:0}
    ]},
  { id:'e7', dim:'排版规范', type:'multi', max:5,
    q:'这些细节做到了哪些？', hint:'可多选',
    opts:[
      {t:'一页以内', s:2},
      {t:'用 PDF 格式投递', s:1.5},
      {t:'文件名规范', s:1},
      {t:'时间线连续，没有空档', s:0.5}
    ]},
  { id:'e8', dim:'加分项', type:'multi', max:5,
    q:'还有这些加分的吗？', hint:'可多选',
    opts:[
      {t:'论文或科研', s:2},
      {t:'品管圈 QCC / 护理改善项目', s:1.5},
      {t:'专科竞赛获奖', s:1},
      {t:'英语四六级 / 雅思', s:0.5}
    ]}
];

var SHORT = {'实习质量':'实习','执业进度':'执业','护理技能':'技能','在校表现':'在校',
  '量化成果':'量化','目标匹配':'匹配','排版规范':'排版','加分项':'加分',
  '执业资质':'资质','工作经历':'经历','证书资质':'证书'};

var ADVICE = {
  '实习质量':{low:'实习别只写「在某院实习 8 个月」，要写科室 + 做了什么 + 多少例。',mid:'再补一句带教老师评语或优秀实习生。'},
  '执业进度':{low:'先确认考试进度，这是应届生唯一能补的硬门槛。',mid:'写清「已通过，成绩合格」，比空着强。'},
  '护理技能':{low:'别写「熟练掌握各项操作」，列 6–8 项具体操作。',mid:'再补 2–3 项专科操作。'},
  '在校表现':{low:'排名、奖学金、竞赛，至少写一条，应届生没工作经历就靠这个。',mid:'把获奖写成「校级二等奖」这种具体级别。'},
  '量化成果':{low:'整份简历一个数字都没有，这是最致命的一处。',mid:'再加一个带教或表彰数据。'},
  '目标匹配':{low:'先看目标医院的招聘公告，按关键词改简历。',mid:'对着公告逐条对照，命中率会明显提升。'},
  '排版规范':{low:'控制在一页，用 PDF，文件名写成姓名-学校-专业。',mid:'补一个正装照片和规范文件名。'},
  '加分项':{low:'有机会参与品管圈或竞赛，这是差异化。',mid:'把已有成果写成一条可量化的成绩。'},
  '执业资质':{low:'注册状态是硬门槛，先确认清楚再投。',mid:'写清注册有效期至某年某月。'},
  '工作经历':{low:'工作经历要写清医院等级、科室、年限、分管床位。',mid:'补一句专科方向或进修经历。'},
  '证书资质':{low:'职称和专科证是拉开差距的地方。',mid:'把取得时间和有效期写全。'}
};

var ans = { fresh: {}, exp: {} };
var mode = 'fresh';
var QUIZ = QUIZ_FRESH;
var list = document.getElementById('list');

function renderQuiz() {
  list.innerHTML = '';
  QUIZ.forEach(function (q, qi) {
    var el = document.createElement('div');
    el.className = 'qcard';
    el.innerHTML =
      '<div class="qhead"><span class="qnum">' + String(qi + 1).padStart(2, '0') +
      '</span><span class="qtxt">' + q.q + '</span></div>' +
      (q.hint ? '<p class="qhint">' + q.hint + '</p>' : '') +
      '<div class="opts">' +
      q.opts.map(function (o, i) {
        var on = '';
        var a = ans[mode][q.id];
        if (q.type === 'single' && a === i) on = ' on';
        if (q.type === 'multi' && a && a.indexOf(i) > -1) on = ' on';
        return '<div class="opt' + (q.type === 'multi' ? ' multi' : '') + on +
          '" data-q="' + q.id + '" data-i="' + i + '" data-t="' + q.type + '">' +
          '<span class="mark"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.4" ' +
          'stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3l2.6 2.6L10 3.4"/></svg></span>' +
          '<span>' + o.t + '</span></div>';
      }).join('') + '</div>';
    list.appendChild(el);
  });
}

document.getElementById('seg').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  mode = b.dataset.m;
  QUIZ = mode === 'fresh' ? QUIZ_FRESH : QUIZ_EXP;
  this.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
  b.classList.add('on');
  renderQuiz();
  update();
});

list.addEventListener('click', function (e) {
  var opt = e.target.closest('.opt');
  if (!opt) return;
  var q = opt.dataset.q, i = Number(opt.dataset.i), t = opt.dataset.t;
  if (t === 'single') {
    ans[mode][q] = i;
    opt.parentElement.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('on'); });
    opt.classList.add('on');
  } else {
    if (!ans[mode][q]) ans[mode][q] = [];
    var at = ans[mode][q].indexOf(i);
    if (at > -1) { ans[mode][q].splice(at, 1); opt.classList.remove('on'); }
    else { ans[mode][q].push(i); opt.classList.add('on'); }
  }
  update();
});

function doneCount() {
  var a = ans[mode];
  return QUIZ.filter(function (q) {
    var v = a[q.id];
    return q.type === 'single' ? v !== undefined : (v && v.length > 0);
  }).length;
}

function update() {
  var d = doneCount();
  document.getElementById('bar').style.width = (d / QUIZ.length * 100) + '%';
  var go = document.getElementById('go');
  go.textContent = '查看结果 · 已完成 ' + d + '/' + QUIZ.length;
  go.disabled = d < QUIZ.length;
}

function calc() {
  return QUIZ.map(function (q) {
    var a = ans[mode][q.id], s = 0;
    if (q.type === 'single') {
      if (a !== undefined) s = q.opts[a].s;
    } else if (a && a.length) {
      s = Math.min(a.reduce(function (x, i) { return x + q.opts[i].s; }, 0), q.max);
    }
    return { dim: q.dim, s: s, max: q.max, pct: s / q.max };
  });
}

function levelOf(t) {
  if (t >= 85) return { t: '优秀', q: ['这份简历，', '可以放心投了。'] };
  if (t >= 70) return { t: '良好', q: ['再补两个数字，', '就能进面试池。'] };
  if (t >= 55) return { t: '及格', q: ['内容有了，', '但还缺让人信的证据。'] };
  return { t: '待改进', q: ['简历还没准备好，', '先补这三处。'] };
}

function loadHist() {
  try { return JSON.parse(localStorage.getItem('cwyc_hist') || '[]'); } catch (e) { return []; }
}
function saveHist(rec) {
  var h = loadHist(); h.push(rec);
  if (h.length > 20) h = h.slice(h.length - 20);
  try { localStorage.setItem('cwyc_hist', JSON.stringify(h)); } catch (e) {}
}

function radarSVG(res) {
  var cx = 120, cy = 120, R = 72, n = res.length;
  var ang = function (i) { return i * 2 * Math.PI / n - Math.PI / 2; };
  var g = '', ax = '', lb = '';
  [0.25, 0.5, 0.75, 1].forEach(function (k) {
    var pts = res.map(function (_, i) {
      return (cx + R * k * Math.cos(ang(i))).toFixed(1) + ',' + (cy + R * k * Math.sin(ang(i))).toFixed(1);
    }).join(' ');
    g += '<polygon class="gl" points="' + pts + '"/>';
  });
  res.forEach(function (_, i) {
    ax += '<line class="ax" x1="' + cx + '" y1="' + cy + '" x2="' +
      (cx + R * Math.cos(ang(i))).toFixed(1) + '" y2="' + (cy + R * Math.sin(ang(i))).toFixed(1) + '"/>';
  });
  var area = res.map(function (r, i) {
    return (cx + R * r.pct * Math.cos(ang(i))).toFixed(1) + ',' +
           (cy + R * r.pct * Math.sin(ang(i))).toFixed(1);
  }).join(' ');
  res.forEach(function (r, i) {
    var x = cx + (R + 20) * Math.cos(ang(i));
    var y = cy + (R + 20) * Math.sin(ang(i));
    lb += '<text x="' + x.toFixed(1) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="middle">' +
          (SHORT[r.dim] || r.dim) + '</text>';
  });
  return '<svg class="radar" viewBox="0 0 240 240">' + g + ax +
    '<polygon class="area" points="' + area + '"/>' + lb + '</svg>';
}

function roundRect(x, X, Y, W, H, R) {
  x.beginPath();
  x.moveTo(X + R, Y);
  x.lineTo(X + W - R, Y); x.quadraticCurveTo(X + W, Y, X + W, Y + R);
  x.lineTo(X + W, Y + H - R); x.quadraticCurveTo(X + W, Y + H, X + W - R, Y + H);
  x.lineTo(X + R, Y + H); x.quadraticCurveTo(X, Y + H, X, Y + H - R);
  x.lineTo(X, Y + R); x.quadraticCurveTo(X, Y, X + R, Y);
  x.closePath();
}

function buildCard(total, level, tags) {
  var c = document.createElement('canvas');
  c.width = 900; c.height = 1200;
  var x = c.getContext('2d');

  x.fillStyle = '#0B6E5F'; x.fillRect(0, 0, 900, 1200);
  var grd = x.createRadialGradient(780, 100, 20, 780, 100, 460);
  grd.addColorStop(0, 'rgba(255,255,255,.13)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = grd; x.fillRect(0, 0, 900, 640);

  x.fillStyle = 'rgba(255,255,255,.62)';
  x.font = '26px -apple-system,"PingFang SC",sans-serif';
  x.fillText('床旁之外 · 护理简历体检', 64, 100);

  var num = String(total);
  x.font = 'bold 220px Georgia,"Times New Roman",serif';
  x.fillStyle = '#FFFFFF';
  var w = x.measureText(num).width;
  x.fillText(num, 64, 360);

  x.font = '42px -apple-system,sans-serif';
  x.fillStyle = 'rgba(255,255,255,.5)';
  x.fillText('/100', 64 + w + 10, 360);

  x.font = 'bold 40px -apple-system,"PingFang SC",sans-serif';
  x.fillStyle = '#C9F0E4';
  x.fillText(level.t, 64, 432);

  x.font = 'bold 54px -apple-system,"PingFang SC",sans-serif';
  x.fillStyle = '#FFFFFF';
  level.q.forEach(function (line, i) { x.fillText(line, 64, 640 + i * 78); });

  var tx = 64;
  tags.slice(0, 3).forEach(function (t) {
    x.font = '26px -apple-system,"PingFang SC",sans-serif';
    var tw = x.measureText(t).width + 46;
    x.fillStyle = 'rgba(255,255,255,.16)';
    roundRect(x, tx, 950, tw, 58, 15); x.fill();
    x.fillStyle = '#EAF7F2';
    x.fillText(t, tx + 23, 989);
    tx += tw + 14;
  });

  x.fillStyle = 'rgba(255,255,255,.45)';
  x.font = '24px -apple-system,sans-serif';
  x.fillText('easonchanty.github.io/nursegoat', 64, 1118);
  x.textAlign = 'right';
  x.fillText('60 秒自测 · 简历不上传', 836, 1118);

  return c.toDataURL('image/png');
}

var AI_PROMPT = '你是三甲医院护理部负责简历初筛的老师。请严格按下面 8 个维度给我的护理简历打分，' +
  '每一项给出得分、扣分理由，以及一句「改成这样」的具体范例（要能直接抄进简历）。\n' +
  '1. 执业资格 / 实习质量\n2. 临床经历深度\n3. 护理技能（是否写了具体操作和例数）\n' +
  '4. 证书与职称\n5. 量化成果（有没有数字）\n6. 与目标医院招聘公告的匹配度\n' +
  '7. 排版与文件规范\n8. 加分项\n' +
  '最后用三句话总结：这份简历最致命的三个问题是什么。\n我的简历如下：\n';

document.getElementById('go').addEventListener('click', function () {
  var res = calc();
  var total = Math.round(res.reduce(function (a, r) { return a + r.s; }, 0));
  var lv = levelOf(total);

  var prev = null;
  var hist = loadHist();
  for (var i = hist.length - 1; i >= 0; i--) {
    if (hist[i].m === mode) { prev = hist[i].s; break; }
  }
  saveHist({ t: Date.now(), m: mode, s: total });

  var deltaHtml = '';
  if (prev === null) {
    deltaHtml = '<p class="delta flat">这是你第一次体检</p>';
  } else {
    var d = total - prev;
    if (d > 0) deltaHtml = '<p class="delta up">比上次高 ' + d + ' 分</p>';
    else if (d < 0) deltaHtml = '<p class="delta down">比上次低 ' + Math.abs(d) + ' 分</p>';
    else deltaHtml = '<p class="delta flat">和上次一样</p>';
  }

  var issues = res.map(function (r) {
    var cls = r.pct >= 0.75 ? 'g' : (r.pct >= 0.5 ? 'y' : 'r');
    var ad = ADVICE[r.dim] || { low: '', mid: '' };
    var txt = r.pct >= 0.75 ? '这块没问题，保持。' : (r.pct >= 0.5 ? ad.mid : ad.low);
    return '<div class="issue"><span class="dot2 ' + cls + '"></span><div>' +
      '<h4>' + r.dim + ' · ' + Math.round(r.pct * 100) + '%</h4>' +
      '<p>' + txt + '</p></div></div>';
  }).join('');

  var sorted = res.slice().sort(function (a, b) { return b.pct - a.pct; });
  var tags = [SHORT[sorted[0].dim] + '强', SHORT[sorted[1].dim] + '强',
              SHORT[sorted[sorted.length - 1].dim] + '偏弱'];

  var histList = loadHist().filter(function (h) { return h.m === mode; })
    .slice(-5).reverse().map(function (h) {
      var dt = new Date(h.t);
      return '<div class="hist"><span>' + (dt.getMonth() + 1) + ' 月 ' + dt.getDate() +
        ' 日</span><b>' + h.s + ' 分</b></div>';
    }).join('');

  var html =
    '<div class="sheet-top"><h5>体检结果</h5>' +
    '<button class="linkbtn" id="again">重新测</button></div>' +
    '<div class="bigscore"><b>' + total + '</b><span>/100</span></div>' +
    '<p class="lv">' + (mode === 'fresh' ? '应届 / 实习期' : '在职护士') + ' · ' + lv.t + '</p>' +
    deltaHtml +
    '<div class="radarwrap">' + radarSVG(res) + '</div>' +
    '<p class="group-title" style="margin:0 4px 8px">逐项看</p>' + issues +
    (histList ? '<p class="group-title" style="margin:16px 4px 8px">你的记录</p><div class="group" style="padding:0 14px">' + histList + '</div>' : '') +
    '<div class="cardwrap"><p class="group-title" style="margin:16px 4px 8px">分享卡</p>' +
    '<img id="cardImg" alt="体检报告卡">' +
    '<p class="tipnote">长按图片保存，发到班级群或朋友圈</p>' +
    '<button class="minibtn" id="copyAI">复制 AI 深度分析指令</button>' +
    '<p class="tipnote">粘到任意 AI（豆包、Kimi、GPT）里，后面接上你的简历全文</p></div>';

  document.getElementById('sheetInner').innerHTML = html;
  document.getElementById('cardImg').src = buildCard(total, lv, tags);

  document.getElementById('again').addEventListener('click', function () {
    location.reload();
  });

  document.getElementById('copyAI').addEventListener('click', function () {
    var btn = this;
    var done = function () { btn.textContent = '已复制，去粘到 AI 里'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(AI_PROMPT).then(done, done);
    } else {
      var ta = document.createElement('textarea');
      ta.value = AI_PROMPT;
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); done();
    }
  });

  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheet').scrollTop = 0;
});

renderQuiz();
update();
</script>
